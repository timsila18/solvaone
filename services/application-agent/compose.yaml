name: solvaone-application-agent
services:
  scheduler:
    image: node:24-bookworm-slim
    profiles: [continuous-worker]
    restart: unless-stopped
    user: node
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [node, /app/scheduler.mjs]
    environment:
      JOB_DESK_WORKER_URL: ${JOB_DESK_WORKER_URL:-https://solvaone.co.ke/api/job-desk/worker/pilot}
      JOB_DESK_WORKER_SECRET_FILE: /run/secrets/worker_secret
      JOB_DESK_WORKER_INTERVAL_MS: '60000'
    secrets:
      - worker_secret
    volumes:
      - ./scheduler.mjs:/app/scheduler.mjs:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  agent:
    image: solvaone-application-agent:latest
    build:
      context: ../..
      dockerfile: services/application-agent/Dockerfile
    restart: unless-stopped
    environment:
      APPLICATION_AGENT_TOKEN_FILE: /run/secrets/agent_token
    secrets:
      - agent_token
    volumes:
      - application-data:/data
    shm_size: 1gb
    init: true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      AGENT_DOMAIN: ${AGENT_DOMAIN:?Set the agent hostname}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificate-data:/data
      - certificate-config:/config
    depends_on:
      agent:
        condition: service_healthy
secrets:
  worker_secret:
    environment: JOB_DESK_WORKER_SECRET
  agent_token:
    environment: APPLICATION_AGENT_TOKEN
volumes:
  application-data:
  certificate-data:
  certificate-config:
